; Локальный CLI-конфиг для Zakopeyki AI Platform (MAMP Windows).
; Глобальный C:\MAMP\conf\php8.1.0\php.ini содержит неверный extension_dir
; (указывает на php5.5.0), поэтому CLI-скрипты проекта используют этот файл:
;   C:\MAMP\bin\php\php8.1.0\php.exe -c php-cli.ini <script>

memory_limit = 1024M
max_execution_time = 0
error_reporting = E_ALL
display_errors = On
date.timezone = Asia/Almaty

extension_dir = "C:\MAMP\bin\php\php8.1.0\ext"
extension = php_mbstring.dll
extension = php_openssl.dll
extension = php_curl.dll
extension = php_pdo_mysql.dll
extension = php_mysqli.dll
extension = php_fileinfo.dll
extension = php_gd.dll
extension = php_exif.dll
extension = php_intl.dll
